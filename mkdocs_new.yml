      - 1.3.2 Conversioni di base: material/01_intro/03_num_sis/02_conversions.md
      - 1.3.3 Aritmetica binaria: material/01_intro/03_num_sis/03_binary_arith.md
    - 1.4 Codifica dell'Informazione (testo, immagini, suono): material/01_intro/04_data_encoding.md
    - 1.5 Algebra di Boole e Porte Logiche: material/01_intro/05_boole.md

  - 2. Pensiero Computazionale e Algoritmi:
    - 2.1 Il concetto di Algoritmo e le sue proprietà: material/02_programming/01_algorithms/lecture.md
    - 2.2 Progettazione di Algoritmi con i Diagrammi di Flusso:
      - 2.2.1 I blocchi fondamentali (sequenza, selezione, iterazione): material/02_programming/02_flow_charts/01_blocks.md
